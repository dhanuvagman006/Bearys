<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nexus</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            background: #0f172a;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .container {

            text-align: center;
        }

        h1 {

            font-size: 4rem;
            margin-bottom: 10px;

            color: #38bdf8;
        }

        p {

            color: #cbd5e1;
            font-size: 1.2rem;
        }

        .status {

            position: absolute;

            bottom: 20px;

            background: #111827;

            padding: 12px 20px;

            border-radius: 12px;

            border: 1px solid #334155;

            font-size: 0.95rem;

            color: #4ade80;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>Nexus</h1>

        <p>
            Intelligent Infrastructure Platform
        </p>

    </div>

    <div class="status">

        {{ status }}

    </div>

</body>

</html>
